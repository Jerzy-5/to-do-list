{% extends 'todo/base.html' %}

{% block content %}
<style>
    .tags-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 1px solid #ccc;
    }

    .tags-title {
        font-size: 32px;
        font-weight: normal;
        color: #000000;
        font-family: sans-serif;
    }

    .btn-add-tag {
        background-color: #0066cc;
        color: white;
        text-decoration: none;
        padding: 6px 12px;
        border: 1px solid #004499;
        font-size: 14px;
        font-family: sans-serif;
    }

    .tags-table {
        width: 100%;
        border-collapse: collapse;
        font-family: sans-serif;
    }

    .tags-table th {
        text-align: left;
        font-size: 14px;
        font-weight: bold;
        color: #000000;
        padding: 10px 0;
        border-bottom: 1px solid #ccc;
    }


    .col-name { width: 40%; }
    .col-update { width: 30%; }
    .col-delete { width: 30%; }

    .tags-table td {
        padding: 15px 0;
        font-size: 15px;
        color: #000000;
        border-bottom: 1px solid #ddd;
        vertical-align: middle;
    }

    .btn-action {
        display: inline-block;
        background-color: #757575;
        color: white;
        text-decoration: none;
        padding: 6px 14px;
        border: 1px solid #555;
        font-size: 14px;
        text-align: center;
    }

    .btn-action:hover {
        background-color: #616161;
    }

    .empty-message {
        font-family: sans-serif;
        color: #666;
        font-size: 14px;
        padding: 15px 0;
    }
</style>

<div class="tags-header">
    <h1 class="tags-title">Tags</h1>
    <a href="{% url 'tag-create' %}" class="btn-add-tag">Add</a>
</div>

{% if tags %}
<table class="tags-table">
    <thead>
        <tr>
            <th class="col-name">Name</th>
            <th class="col-update">Update</th>
            <th class="col-delete">Delete</th>
        </tr>
    </thead>
    <tbody>
        {% for tag in tags %}
        <tr>
            <td>{{ tag.name }}</td>
            <td>
                <a href="{% url 'tag-update' tag.id %}" class="btn-action">Update</a>
            </td>
            <td>
                <a href="{% url 'tag-delete' tag.id %}" class="btn-action">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p class="empty-message">No tags created yet.</p>
{% endif %}

{% endblock %}
